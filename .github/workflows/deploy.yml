name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - private
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build English version
  build-en:
    runs-on: ubuntu-latest
    # ψ-location: timeout for English build
    timeout-minutes: 180  # 3 hours
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      NODE_OPTIONS: "--max-old-space-size=7000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          echo "Starting npm install..."
          npm ci --verbose
          echo "npm install completed"

      - name: Pre-build collapse
        run: |
          echo "Starting pre-build collapse..."
          node scripts/pre-build-collapse.js
          echo "Pre-build collapse completed"

      - name: Build English website
        timeout-minutes: 150  # ψ-location: 2.5 hour timeout for English build
        run: npm run build:en

      - name: Upload English artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-en
          path: ./build
          retention-days: 1

  # Build Chinese version
  build-zh:
    runs-on: ubuntu-latest
    # ψ-location: timeout for Chinese build
    timeout-minutes: 180  # 3 hours
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      NODE_OPTIONS: "--max-old-space-size=7000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          echo "Starting npm install..."
          npm ci --verbose
          echo "npm install completed"

      - name: Pre-build collapse
        run: |
          echo "Starting pre-build collapse..."
          node scripts/pre-build-collapse.js
          echo "Pre-build collapse completed"

      - name: Build Chinese website
        timeout-minutes: 150  # ψ-location: 2.5 hour timeout for Chinese build
        run: npm run build:zh

      - name: Upload Chinese artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-zh
          path: ./build
          retention-days: 1

  # Merge builds
  merge-builds:
    runs-on: ubuntu-latest
    needs: [build-en, build-zh]
    # ψ-location: merge timeout
    timeout-minutes: 30
    steps:
      - name: Download English build
        uses: actions/download-artifact@v4
        with:
          name: build-en
          path: ./build-en

      - name: Download Chinese build
        uses: actions/download-artifact@v4
        with:
          name: build-zh
          path: ./build-zh

      - name: Merge builds
        run: |
          mkdir -p build
          cp -r build-en/* build/
          mkdir -p build/zh-Hans
          cp -r build-zh/* build/zh-Hans/

      - name: Upload merged artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: merge-builds
    timeout-minutes: 30  # ψ-location: deployment timeout
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 