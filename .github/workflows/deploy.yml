name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - private
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: self-hosted
    # ψ-location: extended timeout for multi-language build
    timeout-minutes: 360  # 6 hours - GitHub Actions maximum
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      NODE_OPTIONS: "--max-old-space-size=7000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          echo "Starting npm install..."
          npm ci --verbose
          echo "npm install completed"

      - name: Pre-build collapse
        run: |
          echo "Starting pre-build collapse..."
          node scripts/pre-build-collapse.js
          echo "Pre-build collapse completed"

      - name: Build website
        timeout-minutes: 300  # ψ-location: 5 hour timeout for build step
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: self-hosted
    needs: build
    timeout-minutes: 30  # ψ-location: deployment timeout
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 