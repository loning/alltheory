name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - private
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # ψ-location: extended timeout for multi-language build
    timeout-minutes: 360  # 6 hours - GitHub Actions maximum
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      NODE_OPTIONS: "--max-old-space-size=7000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: System info
        run: |
          echo "=== System Information ==="
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h)"
          echo "Disk space: $(df -h)"
          echo "========================="

      - name: Install dependencies
        run: |
          echo "Starting npm install..."
          npm ci --verbose
          echo "npm install completed"

      - name: Pre-build collapse
        run: |
          echo "Starting pre-build collapse..."
          node scripts/pre-build-collapse.js
          echo "Pre-build collapse completed"

      - name: Build website
        timeout-minutes: 300  # ψ-location: 5 hour timeout for build step specifically
        run: |
          echo "Starting build process at $(date)"
          echo "NODE_OPTIONS: $NODE_OPTIONS"
          echo "Memory before build: $(free -h | grep Mem)"
          
          # Run build with progress monitoring
          npm run build &
          BUILD_PID=$!
          
          # Monitor build progress
          while kill -0 $BUILD_PID 2>/dev/null; do
            echo "Build still running at $(date)..."
            echo "Memory usage: $(free -h | grep Mem)"
            sleep 30
          done
          
          wait $BUILD_PID
          BUILD_EXIT_CODE=$?
          
          echo "Build completed at $(date) with exit code: $BUILD_EXIT_CODE"
          exit $BUILD_EXIT_CODE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30  # ψ-location: deployment timeout
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 