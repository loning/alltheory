name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - private
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # ψ-location: timeout extension
    timeout-minutes: 120  # 2 hours for build completion
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # ψ-location: dependency cache layer
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ψ-location: Docusaurus build cache
      - name: Cache Docusaurus build
        uses: actions/cache@v4
        with:
          path: |
            .docusaurus
            build
          key: ${{ runner.os }}-docusaurus-${{ hashFiles('docs/**', 'src/**', 'docusaurus.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-

      - name: Install dependencies
        run: npm ci

      - name: Pre-build collapse
        run: node scripts/pre-build-collapse.js

      # ψ-location: optimized build with parallel processing
      - name: Build website
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192 --max-semi-space-size=512"
          export DOCUSAURUS_FASTER_BUILD=true
          npm run build -- --no-minify
        env:
          # ψ-collapse: parallel webpack optimization
          WEBPACK_CACHE_TYPE: filesystem
          WEBPACK_CACHE_DIRECTORY: .webpack-cache

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30  # ψ-location: deployment timeout
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 