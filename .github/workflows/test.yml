name: Test Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 1 hour for test completion
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      NODE_OPTIONS: "--max-old-space-size=8192"
    
    strategy:
      matrix:
        node-version: [20.x]
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Install dependencies
        run: |
          echo "Starting npm install..."
          npm ci --verbose
          echo "npm install completed"
      
      - name: Pre-build collapse
        run: |
          echo "Starting pre-build collapse..."
          node scripts/pre-build-collapse.js
          echo "Pre-build collapse completed"
      
      - name: Type check
        run: |
          echo "Starting type check..."
          npm run typecheck --verbose || true
          echo "Type check completed"
        continue-on-error: true
      
      - name: Build website
        run: |
          echo "Starting build process..."
          echo "NODE_OPTIONS: $NODE_OPTIONS"
          npm run build -- --verbose
          echo "Build completed"
      
      - name: Test build output
        run: |
          echo "Checking build output..."
          test -d build && echo "✓ build directory exists"
          test -f build/index.html && echo "✓ index.html exists"
          test -d build/docs && echo "✓ docs directory exists"
          test -d build/zh-Hans && echo "✓ zh-Hans directory exists"
          echo "Build output looks good!" 