name: Test Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # ψ-location: 6 hours to match deploy workflow
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      NODE_OPTIONS: "--max-old-space-size=7000"
    
    strategy:
      matrix:
        node-version: [20.x]
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Install dependencies
        run: |
          echo "Starting npm install..."
          npm ci --verbose
          echo "npm install completed"
      
      - name: Pre-build collapse
        run: |
          echo "Starting pre-build collapse..."
          node scripts/pre-build-collapse.js
          echo "Pre-build collapse completed"
      
      - name: Type check
        run: |
          echo "Starting type check..."
          npm run typecheck || true
          echo "Type check completed"
        continue-on-error: true
      
      - name: Build website
        timeout-minutes: 300  # ψ-location: 5 hour timeout for build step
        run: npm run build 