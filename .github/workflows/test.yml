name: Test Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 1 hour for test completion
    
    strategy:
      matrix:
        node-version: [20.x]
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Cache Docusaurus build
        uses: actions/cache@v4
        with:
          path: |
            .docusaurus
            build
          key: ${{ runner.os }}-docusaurus-test-${{ matrix.node-version }}-${{ hashFiles('docs/**', 'src/**', 'docusaurus.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-test-${{ matrix.node-version }}-
            ${{ runner.os }}-docusaurus-test-
      
      - name: Install dependencies
        run: npm ci
      
      - name: Pre-build collapse
        run: node scripts/pre-build-collapse.js
      
      - name: Type check
        run: npm run typecheck
        continue-on-error: true
      
      # ψ-location: optimized test build
      - name: Build website
        run: |
          export NODE_OPTIONS="--max-old-space-size=8192"
          export CI=true
          npm run build
        env:
          # ψ-collapse: build optimization flags
          GENERATE_SOURCEMAP: false
          INLINE_RUNTIME_CHUNK: false
      
      - name: Test build output
        run: |
          echo "Checking build output..."
          test -d build
          test -f build/index.html
          test -d build/docs
          test -d build/zh-Hans
          echo "Build output looks good!" 