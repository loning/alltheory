name: Test Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # ψ-location: 6 hours to match deploy workflow
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      NODE_OPTIONS: "--max-old-space-size=10240"
    
    strategy:
      matrix:
        node-version: [22.x]
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Install dependencies
        run: |
          echo "Starting npm install..."
          npm ci --verbose
          echo "npm install completed"
      
      - name: Pre-build collapse
        run: |
          echo "Starting pre-build collapse..."
          node scripts/pre-build-collapse.js
          echo "Pre-build collapse completed"
      
      - name: Type check
        run: |
          echo "Starting type check..."
          npm run typecheck || true
          echo "Type check completed"
        continue-on-error: true
      
      - name: Clean memory before build
        run: |
          echo "=== Memory status before cleanup ==="
          free -h
          echo "=== Cleaning memory ==="
          # Clear page cache, dentries and inodes
          sudo sh -c "echo 3 > /proc/sys/vm/drop_caches" || true
          # Force garbage collection
          sudo sh -c "sync && echo 1 > /proc/sys/vm/drop_caches" || true
          echo "=== Memory status after cleanup ==="
          free -h
      
      - name: Build website
        timeout-minutes: 300  # ψ-location: 5 hour timeout for build step
        env:
          NODE_OPTIONS: "--max-old-space-size=10240"  # 10GB in MB
        run: |
          echo "=== Build environment ==="
          echo "NODE_OPTIONS: $NODE_OPTIONS"
          free -h
          echo "=== Starting build ==="
          npm run build 