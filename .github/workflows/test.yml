name: Test Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # ψ-location: increased to 6 hours to match deploy workflow
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true
      NODE_OPTIONS: "--max-old-space-size=7000"
    
    strategy:
      matrix:
        node-version: [20.x]
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: System info
        run: |
          echo "=== System Information ==="
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h)"
          echo "Disk space: $(df -h)"
          echo "========================="
      
      - name: Install dependencies
        run: |
          echo "Starting npm install..."
          npm ci --verbose
          echo "npm install completed"
      
      - name: Pre-build collapse
        run: |
          echo "Starting pre-build collapse..."
          node scripts/pre-build-collapse.js
          echo "Pre-build collapse completed"
      
      - name: Type check
        run: |
          echo "Starting type check..."
          npm run typecheck || true
          echo "Type check completed"
        continue-on-error: true
      
      - name: Build website
        timeout-minutes: 300  # ψ-location: 5 hour timeout for build step specifically
        run: |
          echo "Starting build process at $(date)"
          echo "NODE_OPTIONS: $NODE_OPTIONS"
          echo "Memory before build: $(free -h | grep Mem)"
          
          # Run build with progress monitoring
          npm run build &
          BUILD_PID=$!
          
          # Monitor build progress
          while kill -0 $BUILD_PID 2>/dev/null; do
            echo "Build still running at $(date)..."
            echo "Memory usage: $(free -h | grep Mem)"
            sleep 30
          done
          
          wait $BUILD_PID
          BUILD_EXIT_CODE=$?
          
          echo "Build completed at $(date) with exit code: $BUILD_EXIT_CODE"
          exit $BUILD_EXIT_CODE
      
      - name: Test build output
        run: |
          echo "Checking build output..."
          test -d build && echo "✓ build directory exists"
          test -f build/index.html && echo "✓ index.html exists"
          test -d build/docs && echo "✓ docs directory exists"
          test -d build/zh-Hans && echo "✓ zh-Hans directory exists"
          echo "Build output looks good!" 